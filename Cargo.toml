
[package]
edition = "2021"
name    = "napi_sudachi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = "3.0.0"
napi-derive = "3.0.0"

  [dependencies.sudachi]
  git = "https://github.com/WorksApplications/sudachi.rs.git"
  tag = "v0.6.11"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
